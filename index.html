<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="保存在你的裝置上的英文單字、片語與文法複習。">
  <title>英文複習</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#home"><img src="./icon-192.png" alt="" width="36" height="36">英文複習 <span class="badge">離線學習</span></a>
    <nav aria-label="主要導覽">
      <a href="#home">首頁</a>
      <a href="#lists">學習清單</a>
      <a href="#settings">設定與匯入</a>
    </nav>
  </header>
  <main id="app" tabindex="-1"><p>正在讀取本機資料……</p></main>
  <aside class="system-status" aria-label="系統狀態">
    <p id="notice" role="status" aria-live="polite"></p>
    <div class="offline-line"><span id="offline-status">正在檢查離線資源……</span><button id="update-app" class="small" hidden>安裝新版本</button></div>
  </aside>
  <footer>資料只保存在此瀏覽器，不會同步到其他裝置。請定期匯出完整備份。</footer>
  <noscript>此應用程式需要啟用 JavaScript，才能在本機保存及複習資料。</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
