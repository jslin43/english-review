<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">

  <title>英文複習</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    main {
      max-width: 480px;
      margin: 32px auto;
    }

    .card {
      padding: 28px;
      background: white;
      border-radius: 20px;
    }

    #word {
      font-size: 36px;
      overflow-wrap: anywhere;
    }

    button {
      min-height: 48px;
      padding: 12px 18px;
      margin: 8px 8px 0 0;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      background: #2563eb;
      color: white;
    }

    #status {
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <h1>英文複習</h1>

    <section class="card" aria-live="polite">
      <p id="counter"></p>
      <h2 id="word" lang="en"></h2>

      <div id="answer" hidden>
        <p id="meaning"></p>
        <p id="example" lang="en"></p>
      </div>
    </section>

    <button id="reveal" type="button">看答案</button>
    <button id="next" type="button">下一個</button>

    <p id="status" role="status">正在準備離線功能……</p>
  </main>

  <script>
    const cards = [
      {
        word: "ability",
        meaning: "能力",
        example: "She has the ability to explain difficult ideas clearly."
      },
      {
        word: "improve",
        meaning: "改善；進步",
        example: "Daily practice can improve your English."
      },
      {
        word: "take care of",
        meaning: "照顧",
        example: "We take care of our neighbor's cat."
      }
    ];

    const word = document.querySelector("#word");
    const meaning = document.querySelector("#meaning");
    const example = document.querySelector("#example");
    const answer = document.querySelector("#answer");
    const counter = document.querySelector("#counter");
    const status = document.querySelector("#status");

    let index = 0;

    function showCard() {
      const card = cards[index];

      word.textContent = card.word;
      meaning.textContent = card.meaning;
      example.textContent = card.example;
      counter.textContent = `第 ${index + 1} 張／共 ${cards.length} 張`;
      answer.hidden = true;
    }

    document.querySelector("#reveal").addEventListener("click", () => {
      answer.hidden = false;
    });

    document.querySelector("#next").addEventListener("click", () => {
      index = (index + 1) % cards.length;
      showCard();
    });

    async function prepareOffline() {
      if (!("serviceWorker" in navigator)) {
        status.textContent = "目前環境不支援離線功能，請使用 HTTPS 網址。";
        return;
      }

      try {
        await navigator.serviceWorker.register("./sw.js");
        await navigator.serviceWorker.ready;
        status.textContent = "離線資源已準備完成。";
      } catch (error) {
        console.error(error);
        status.textContent = "離線設定失敗，請檢查網址與檔案是否完整。";
      }
    }

    showCard();
    prepareOffline();
  </script>
</body>
</html>
